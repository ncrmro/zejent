id: zejent
label: Zejent container leader
description: Leader profile for the Zejent Podman/Nix/Zellij agent container.
inherits:
  - founder
# Host /root/.pi is mounted read-only for credentials. Do not symlink writable
# runtime/package/session trees from the composite profile back into /root/.pi;
# let Pi create them under the writable composite profile and use
# PI_CODING_AGENT_SESSION_DIR=/tmp/pi-sessions for durable sessions.
state_persistence:
  plugins/: discard
  tmp/: discard
  cache/: discard
  sessions/: discard
  npm/: discard
  git/: discard
  utilities/: discard
  bin/: discard
controls:
  pi:
    append_system_prompt:
      - file: /root/.outfitter/prompts/zejent/SYSTEM.md
