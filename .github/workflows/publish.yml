# REQ-011: publish the flake-built image to ghcr.io/ncrmro/zejent:latest.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build image with the flake
        run: nix build ./code#image

      - name: Push to GHCR
        run: |
          skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          skopeo copy docker-archive:./result "docker://ghcr.io/${{ github.repository }}:latest"
